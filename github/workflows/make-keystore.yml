name: Create Keystore (run ONCE)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - name: Generate signing key
        run: |
          PASS="$(openssl rand -hex 12)"
          keytool -genkeypair -v \
            -keystore asia-release.jks -storetype PKCS12 \
            -alias asia -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PASS" -keypass "$PASS" \
            -dname "CN=Asia Hesab, O=Asia, C=IR"
          {
            echo "KEYSTORE_PASSWORD=$PASS"
            echo "KEY_PASSWORD=$PASS"
            echo "KEY_ALIAS=asia"
            echo "KEYSTORE_BASE64=$(base64 -w0 asia-release.jks)"
          } > keystore-info.txt

      - name: Upload (private, 1 day)
        uses: actions/upload-artifact@v4
        with:
          name: asia-keystore-SECRET
          path: |
            asia-release.jks
            keystore-info.txt
          retention-days: 1
